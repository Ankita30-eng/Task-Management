<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; }
    .container { width: 350px; margin: 100px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px gray; text-align: center; }
    input { width: 90%; padding: 10px; margin: 10px 0; }
    button { padding: 10px 20px; border: none; border-radius: 5px; background: #007bff; color: white; cursor: pointer; }
    button:hover { background: #0056b3; }
    a { text-decoration: none; color: #007bff; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sign Up</h2>
    <form method="POST">
      {% csrf_token %}
      <input type="text" name="fnm" placeholder="Username" required><br>
      <input type="email" name="emailid" placeholder="Email" required><br>
      <input type="password" name="pwd" placeholder="Password" required><br>
      <button type="submit">Register</button>
    </form>
  <p>Already have an account? <a href="/login">Login</a></p>
  </div>
</body>
</html>
