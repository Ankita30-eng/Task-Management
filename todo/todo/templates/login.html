<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: Arial; background: #f8f9fa; }
    .container { width: 350px; margin: 100px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px gray; text-align: center; }
    input { width: 90%; padding: 10px; margin: 10px 0; }
    button { padding: 10px 20px; border: none; border-radius: 5px; background: #28a745; color: white; cursor: pointer; }
    button:hover { background: #218838; }
    a { text-decoration: none; color: #007bff; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form method="POST">
      {% csrf_token %}
      <input type="text" name="fnm" placeholder="Username" required><br>
      <input type="password" name="pwd" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'signup' %}">Register</a></p>
  </div>
</body>
</html>
